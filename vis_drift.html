<!DOCTYPE html>
<meta charset="utf-8">
<title>pysupera — true vs inferred drift</title>
<style>
  /* Surfaces and ink are the data-viz reference instance's dark mode, nudged
     to the pane colour the other two viewers already use. */
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#2a313a;
    --text:#d8dee9; --text2:#8b949e; --accent:#58a6ff;
    /* Categorical slots 1-6, dark steps, in the documented fixed order.
       Never cycled: a seventh category folds into "other" (--cat-other). */
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70;
    --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300;
    --cat-other:#6e7681;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 ui-sans-serif,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
  label{color:var(--text2);font-size:12px}
  input[type=file]{font-size:11px;color:var(--text2);max-width:230px}
  select,button{background:#21262d;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:3px 8px;font-size:12px}
  button:hover{border-color:var(--accent);cursor:pointer}
  #filters{padding:5px 12px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--text2)}
  #filters label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
  .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
  main{flex:1;display:flex;min-height:0}
  .pane{flex:1;min-width:0;position:relative;overflow:hidden}
  .pane + .pane{border-left:1px solid var(--line)}
  .pane canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ttl{position:absolute;left:10px;top:9px;z-index:4;background:rgba(13,17,23,.9);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:11px;color:var(--text2);white-space:pre-wrap}
  .ttl b{color:var(--text)}
  #banner{position:absolute;left:10px;right:10px;top:10px;background:#5a1d1d;border:1px solid #a33;border-radius:6px;padding:8px 10px;font-size:12px;display:none;z-index:6;white-space:pre-wrap}
  #note{position:absolute;left:10px;right:10px;top:10px;background:#1d3a5a;border:1px solid #36c;border-radius:6px;padding:7px 10px;font-size:12px;display:none;z-index:5;white-space:pre-wrap}
  #pinfo{position:absolute;right:10px;bottom:10px;background:rgba(13,17,23,.95);border:1px solid var(--line);border-radius:6px;padding:8px 11px;font-size:12px;z-index:4;display:none;font-variant-numeric:tabular-nums}
  #pinfo table{border-collapse:collapse} #pinfo td{padding:1px 0}
  #pinfo td:first-child{color:var(--text2);padding-right:14px}
  #legend{position:absolute;left:10px;bottom:10px;background:rgba(13,17,23,.92);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:11px;z-index:4;max-height:44%;overflow:auto}
  #legend .row{display:flex;align-items:center;gap:6px;margin:2px 0}
  #status{position:absolute;right:10px;top:9px;background:rgba(13,17,23,.9);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:11px;color:var(--text2);z-index:4;white-space:pre-wrap;max-width:46%}
  #log{position:absolute;right:10px;bottom:10px;background:rgba(13,17,23,.9);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:11px;color:var(--text2);max-height:28%;overflow:auto;max-width:60%;z-index:3}
  .k{color:var(--text2)} .v{color:var(--text)} b{color:var(--accent)}
</style>

<header>
  <label>output .h5 <input type="file" id="f-out" accept=".h5"></label>
  <label>event <select id="ev"></select></label>
  <label>colour by
    <select id="mode">
      <option value="energy">energy</option>
      <option value="sem">instance semantic type</option>
      <option value="frag">fragment id</option>
      <option value="inst" selected>instance id</option>
      <option value="inter">interaction id</option>
      <option value="pdg">particle type (PDG)</option>
    </select>
  </label>
  <label>highlight
    <select id="hl">
      <option value="inst" selected>instance</option>
      <option value="frag">fragment</option>
      <option value="inter">interaction</option>
    </select>
  </label>
  <label>point size <input type="range" id="psize" min="1" max="8" step="0.5" value="2.5" style="width:70px"></label>
  <label>others <input type="range" id="dim" min="0" max="1" step="0.01" value="0.03" style="width:80px"><span id="dimv" class="k">0.03</span></label>
  <label><input type="checkbox" id="logE" checked> log scale</label>
  <label><input type="checkbox" id="sync" checked> sync cameras</label>
  <label>show &ge; <input type="range" id="thr" min="0" max="99" step="1" value="0" style="width:90px"><span id="thrv" class="k">all</span></label>
  <button id="fit">fit (c)</button>
  <span id="hint" class="k">load a pysupera output — hover a point to follow it across both views</span>
</header>
<div id="filters"><span>show semantic type:</span></div>

<main>
  <div class="pane" id="pane-true">
    <div class="ttl"><b>true x</b>   x + points/true_x_shift</div>
    <div id="banner"></div><div id="note"></div><div id="legend"></div><div id="log"></div>
  </div>
  <div class="pane" id="pane-nom">
    <div class="ttl"><b>inferred x</b>   as stored, t0 assumed at the beam time</div>
    <div id="status">no file loaded</div><div id="pinfo"></div>
  </div>
</main>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------- state --
const S = {
  out:null, ev:0, nEvents:0,
  n:0,                      // points in this event
  feat:null,                // Float32Array 6/pt: x,y,z,t,dE,dX  (x = inferred)
  shift:null,               // Float32Array: true_x = x + shift
  ptsTrue:null, ptsNom:null,
  instRow:null, fragRow:null, partRow:null,   // particle-table row per point
  isLE:null,                // per point, from its instance's LE point range
  key:null,                 // highlight key per point, for the current level
  sel:-1, dim:0.03,
  thrPct:0, thrVal:0,       // display cut on the energy column, see applyFilter
  meta:{},                  // what the file says its energy column holds
  mode:'inst', hl:'inst',
  cols:null,                // particle columns for this event
  idRow:null,               // particle id -> row
  semShow:new Set(),        // semantic types not hidden
  visible:null,             // Uint8Array per point after the filter
  hasShift:false,
};
let H5File, FS;
const V = {tru:null, nom:null};

const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const log = m => { logEl.textContent = (m + '\n' + logEl.textContent).slice(0, 3000); };
function banner(id, msg){
  const el = document.getElementById(id);
  el.style.display = msg ? 'block' : 'none';
  if(msg){ el.textContent = msg; }
}

// ------------------------------------------------------------- palette --
// Categorical slots 1-6 in the documented fixed order, dark steps.  Six hues
// cannot clear the all-pairs CVD floor -- no six in this lightness band can --
// so identity is never carried by colour alone here: a legend is always up,
// every class can be isolated with the filter strip, and the hover panel
// names the class in words.  Validated on the adjacent pairlist: worst CVD
// dE 8.4, worst normal-vision dE 19.3 against the #0e1116 surface.
const CAT = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300'];
const CAT_OTHER = '#6e7681';

const SEM = {1:'shower', 2:'track', 3:'delta', 4:'Michel', 5:'LE scatter', 6:'unknown'};
const SEM_ORDER = [2, 1, 3, 4, 5, 6];      // track and shower first: the common pair
const SEM_COLOR = {};
SEM_ORDER.forEach((v, i) => { SEM_COLOR[v] = CAT[i]; });

// A fixed table, not a generated hue per species: the tail folds into "other".
const PDG_ORDER = [
  [13,'mu-'], [-13,'mu+'], [11,'e-'], [-11,'e+'], [22,'gamma'],
  [2212,'proton'], [2112,'neutron'], [211,'pi+'], [-211,'pi-'],
];
const PDG_NAME = new Map(PDG_ORDER);
const PDG_COLOR = new Map();
// Nine species over six slots would cycle, which the palette rule forbids, so
// only the first six get a hue and the rest join "other" with the tail.
PDG_ORDER.slice(0, 6).forEach(([p], i) => PDG_COLOR.set(p, CAT[i]));

// Sequential: one hue, monotonic in lightness.  Reversed for a dark surface,
// so "near zero" is the step that recedes into the background and the largest
// value is the brightest.  Blue 700 -> 100 from the reference ramp.
const SEQ = ['#0d366b','#104281','#184f95','#1c5cab','#256abf','#2a78d6',
             '#3987e5','#5598e7','#6da7ec','#86b6ef','#9ec5f4','#b7d3f6','#cde2fb'];

// Diverging: the energy column is dE in deposit mode but *charge* in hit
// mode, and the readout response is bipolar -- about a sixth of hits are
// negative.  Signed data around a meaningful zero is a diverging encoding,
// not a sequential one, so when negatives are present the ramp switches:
// blue and red poles about a neutral gray midpoint, equal steps per arm,
// symmetric about zero so that zero is always the gray.
const DIV_NEG = '#3987e5', DIV_MID = '#383835', DIV_POS = '#e34948';
function lerpHex(a, b, f){
  const A = hex2rgb(a), B = hex2rgb(b);
  return [A[0]+(B[0]-A[0])*f, A[1]+(B[1]-A[1])*f, A[2]+(B[2]-A[2])*f];
}

const hex2rgb = h => [parseInt(h.slice(1,3),16)/255,
                      parseInt(h.slice(3,5),16)/255,
                      parseInt(h.slice(5,7),16)/255];
const CAT_RGB = CAT.map(hex2rgb);
const SEQ_RGB = SEQ.map(hex2rgb);
const OTHER_RGB = hex2rgb(CAT_OTHER);
const DIV_RGB = (() => {
  const n = 6, out = [];
  for(let i = n; i > 0; i--) out.push(lerpHex(DIV_NEG, DIV_MID, 1 - i/n));
  out.push(hex2rgb(DIV_MID));
  for(let i = 1; i <= n; i++) out.push(lerpHex(DIV_MID, DIV_POS, i/n));
  return out;
})();
const rgb2css = c => `rgb(${c.map(v => Math.round(v*255)).join(',')})`;

// Ids run to thousands, so they cannot have a legend and cannot be assigned
// from a fixed list.  A stable hash keeps one object one colour across both
// panes and across a re-render, which is all the id modes need to do --
// identity here is carried by the hover highlight, not by telling two hues
// apart.
function hashColor(id){
  if(id < 0) return [0.30,0.33,0.38];
  const h = Math.imul(id ^ 0x9e3779b9, 0x85ebca6b) >>> 0;
  const c = new THREE.Color().setHSL((h % 360)/360, 0.62, 0.60);
  return [c.r, c.g, c.b];
}

// ------------------------------------------------------------ h5 helpers --
// h5wasm has reported attrs as bare values and as {value,...} wrappers
// across versions; accept either.
function attr(f, path, name){
  try{
    const a = f.get(path).attrs[name];
    if(a === undefined || a === null) return null;
    return (typeof a === 'object' && 'value' in a) ? a.value : a;
  }catch(e){ return null; }
}
// The energy column holds measured charge when the run asked for charge and
// true dE otherwise.  Read it rather than guess: inferring from the presence
// of negative values gets a quiet event wrong.
function quantity(){
  if(S.meta.point_source === 'hits' && S.meta.hit_energy !== 'true_de')
    return {name:'charge', unit:''};
  return {name:'energy', unit:'MeV'};
}
const has = (f,p) => { try { return f.get(p) !== null; } catch(e){ return false; } };
const val = (f,p) => f.get(p).value;
const sl  = (f,p,a,b) => f.get(p).slice([[a,b]]);
const READABLE = new Set(['1','2','3','4','5','6']);
function filterIds(d){
  const f = d && d.filters;
  if(!f) return [];
  if(Array.isArray(f)) return f.map(x => String(x && x.id !== undefined ? x.id : x));
  if(typeof f === 'object') return Object.keys(f).map(String);
  return [];
}
function unreadableFilter(f, path){
  try{ const bad = filterIds(f.get(path)).filter(i => !READABLE.has(i));
       return bad.length ? bad.join(',') : null; }catch(e){ return null; }
}

// --------------------------------------------------------------- loading --
async function boot(){
  const h5wasm = (await import('https://cdn.jsdelivr.net/npm/h5wasm@0.7.3/dist/esm/hdf5_hl.js')).default;
  const Module = await h5wasm.ready;
  H5File = h5wasm.File; FS = Module.FS;
  log('h5wasm ready');
}
const booted = boot();

document.getElementById('f-out').onchange = async e => {
  const file = e.target.files[0]; if(!file) return;
  try{
    await booted;
    FS.writeFile('out.h5', new Uint8Array(await file.arrayBuffer()));
    S.out = new H5File('out.h5', 'r');
    S.nEvents = Number(val(S.out, 'n_events'));
    S.meta = {};
    for(const k of ['point_source','hit_energy','hit_x_from','readout_type']){
      const a = attr(S.out, '/', k);
      if(a !== null) S.meta[k] = String(a);
    }
    log(`output: format ${val(S.out,'format_version')}, ${S.nEvents} events`);
    const bad = unreadableFilter(S.out, 'points/flat');
    if(bad){
      S.out = null;
      return banner('banner',
        `This output uses HDF5 filter ${bad}, which the browser cannot decode.\n` +
        `h5wasm handles gzip only, and an unsupported filter yields garbage rather\n` +
        `than an error -- so the file is refused instead of drawn wrongly.\n\n` +
        `    pysupera-repack ${file.name} out_gzip.h5 -c gzip`);
    }
    banner('banner','');
    S.hasShift = has(S.out, 'points/true_x_shift');
    const sel = document.getElementById('ev'); sel.innerHTML = '';
    for(let i = 0; i < S.nEvents; i++){
      const o = document.createElement('option'); o.value = i; o.textContent = i;
      sel.appendChild(o);
    }
    rebuild();
  }catch(err){ log('ERROR opening output: ' + err.message); }
};

document.getElementById('ev').onchange   = e => { S.ev = +e.target.value; rebuild(); };
document.getElementById('mode').onchange = e => { S.mode = e.target.value; recolour(); };
document.getElementById('hl').onchange   = e => { S.hl = e.target.value; buildKeys(); S.sel = -1; recolour(); };
document.getElementById('logE').onchange = () => recolour();
document.getElementById('psize').oninput = e => {
  for(const v of [V.tru, V.nom]) if(v && v.cloud){
    v.cloud.material.size = +e.target.value;
    if(v.selCloud) v.selCloud.material.size = +e.target.value;
  }
};
document.getElementById('dim').oninput = e => {
  S.dim = +e.target.value;
  document.getElementById('dimv').textContent = S.dim.toFixed(2);
  paint();
};
document.getElementById('thr').oninput = e => {
  S.thrPct = +e.target.value; applyFilter(); paint();
};
document.getElementById('fit').onclick = fitView;
addEventListener('keydown', e => { if(e.key === 'c') fitView(); });

// ------------------------------------------------- per-event resolution --
// A point's owner is the block it falls in: ownership is positional, exactly
// as the format intends.  Instance blocks cover every point with no overlap;
// particle blocks cover about two thirds, which is why the per-particle
// fields fall back to the fragment's representative below.
function rowsOf(n, pa, starts, ends){
  const row = new Int32Array(n).fill(-1);
  for(const [S0, E0] of starts.map((s, i) => [s, ends[i]])){
    for(let k = 0; k < S0.length; k++){
      const s = Number(S0[k]); if(s < 0) continue;
      const lo = Math.max(0, s - pa), hi = Math.min(n, Number(E0[k]) - pa);
      for(let j = lo; j < hi; j++) row[j] = k;
    }
  }
  return row;
}

function buildEvent(){
  const f = S.out, ev = S.ev;
  const eo = val(f,'events/offsets'), po = val(f,'points/offsets');
  const a = Number(eo[ev]), b = Number(eo[ev+1]);
  const pa = Number(po[ev]), pb = Number(po[ev+1]);
  const n = S.n = pb - pa;
  if(n <= 0){ S.feat = new Float32Array(0); S.shift = new Float32Array(0); return; }

  S.feat = Float32Array.from(f.get('points/flat').slice([[pa,pb],[0,6]]));
  S.shift = S.hasShift
    ? Float32Array.from(sl(f,'points/true_x_shift', pa, pb))
    : new Float32Array(n);

  const grp = f.get('particles');
  const col = nm => grp.keys().includes(nm) ? sl(f,'particles/'+nm, a, b) : null;
  const c = {};
  for(const k of ['id','inst_id','frag_id','interaction_id','pdg','parent_pdg',
                  'geant4_trackid','geant4_parent_pdg','inst_sem_type','sem_type',
                  'inst_parent_id','frag_parent_id','parent_id',
                  'inst_pc_start','inst_pc_end','inst_pc_le_start','inst_pc_le_end',
                  'frag_pc_start','frag_pc_end','frag_pc_le_start','frag_pc_le_end',
                  'pc_start','pc_end'])
    c[k] = col(k);
  S.cols = c;

  S.idRow = new Map();
  for(let k = 0; k < c.id.length; k++) S.idRow.set(Number(c.id[k]), k);

  S.instRow = rowsOf(n, pa, [c.inst_pc_start, c.inst_pc_le_start],
                            [c.inst_pc_end,   c.inst_pc_le_end]);
  S.fragRow = rowsOf(n, pa, [c.frag_pc_start, c.frag_pc_le_start],
                            [c.frag_pc_end,   c.frag_pc_le_end]);
  S.partRow = c.pc_start ? rowsOf(n, pa, [c.pc_start], [c.pc_end])
                         : new Int32Array(n).fill(-1);

  // LE-ness is positional, not a column: a point is low-energy exactly when
  // it falls in its instance's *LE* point range.  Defragmentation splits a
  // stray clump off as its own kLEScatter particle and the merging
  // conditions absorb it back, so its points end up inside a shower
  // instance -- but in that instance's LE block, not its main one.  Reading
  // inst_sem_type alone would call those points "shower", which is the host
  // instance's type and not what the point is.
  S.isLE = new Uint8Array(n);
  for(let k = 0; k < c.id.length; k++){
    if(Number(c.inst_id[k]) !== Number(c.id[k])) continue;
    const s0 = Number(c.inst_pc_le_start[k]);
    if(s0 < 0) continue;
    const lo = Math.max(0, s0 - pa), hi = Math.min(n, Number(c.inst_pc_le_end[k]) - pa);
    for(let j = lo; j < hi; j++) S.isLE[j] = 1;
  }

  // positions: the two panes differ in x and nothing else
  const t = new Float32Array(n*3), q = new Float32Array(n*3);
  for(let i = 0; i < n; i++){
    const x = S.feat[i*6], y = S.feat[i*6+1], z = S.feat[i*6+2];
    q[i*3] = x;                 q[i*3+1] = y; q[i*3+2] = z;
    t[i*3] = x + S.shift[i];    t[i*3+1] = y; t[i*3+2] = z;
  }
  S.ptsNom = q; S.ptsTrue = t;

  buildFilters();
  buildKeys();
}

const attrOf = (row, key) => (row >= 0 && S.cols[key]) ? Number(S.cols[key][row]) : -1;
const SEM_LE = 5;                       // SemanticType.kLEScatter
// The point's own type: LE if it sits in its instance's LE block, otherwise
// the instance's type.
const semOf   = i => S.isLE[i] ? SEM_LE : attrOf(S.instRow[i], 'inst_sem_type');
const hostSemOf = i => attrOf(S.instRow[i], 'inst_sem_type');
const instOf  = i => attrOf(S.instRow[i], 'id');
const fragOf  = i => attrOf(S.fragRow[i], 'id');
const interOf = i => attrOf(S.instRow[i], 'interaction_id');
const pdgOf   = i => attrOf(S.instRow[i], 'pdg');

function buildKeys(){
  const n = S.n, k = new Int32Array(n);
  const get = S.hl === 'frag' ? fragOf : S.hl === 'inter' ? interOf : instOf;
  for(let i = 0; i < n; i++) k[i] = get(i);
  S.key = k;
}

function buildFilters(){
  const host = document.getElementById('filters');
  host.innerHTML = '<span>show semantic type:</span>';
  const present = new Set();
  for(let i = 0; i < S.n; i++) present.add(semOf(i));
  S.semShow = new Set(present);
  for(const v of SEM_ORDER){
    if(!present.has(v)) continue;
    const lab = document.createElement('label');
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = true;
    cb.onchange = () => { cb.checked ? S.semShow.add(v) : S.semShow.delete(v);
                          applyFilter(); paint(); };
    const sw = document.createElement('span');
    sw.className = 'sw'; sw.style.background = SEM_COLOR[v] || CAT_OTHER;
    lab.append(cb, sw, document.createTextNode(SEM[v] || ('type ' + v)));
    host.appendChild(lab);
  }
  applyFilter();
}

// Filtering hides at paint time rather than rebuilding the buffers, but the
// picker consults it too, so nothing hidden can be selected.
//
// The display cut is a percentile of |value| shown as the absolute number it
// lands on, because "above 28" is quotable and "the faintest half" is not.
// The detector simulation applies no threshold of its own, so without this
// every pixel carrying any induced-field influence is on screen.
function applyFilter(){
  let thr = 0;
  if(S.thrPct > 0 && S.n){
    const a = [];
    for(let i = 0; i < S.n; i++) a.push(Math.abs(S.feat[i*6+4]));
    a.sort((x,y) => x-y);
    thr = a[Math.min(a.length-1, Math.floor(S.thrPct/100 * a.length))];
  }
  S.thrVal = thr;
  const vis = new Uint8Array(S.n);
  let kept = 0, q = 0, qAll = 0;
  for(let i = 0; i < S.n; i++){
    const a = Math.abs(S.feat[i*6+4]);
    qAll += a;
    const pass = S.semShow.has(semOf(i)) && a >= thr;
    vis[i] = pass ? 1 : 0;
    if(pass){ kept++; q += a; }
  }
  S.visible = vis;
  const el = document.getElementById('thrv');
  const u = quantity().unit;
  el.textContent = S.thrPct <= 0 ? 'all'
    : `${fmt(thr,3)}${u ? ' ' + u : ''} · ${(100*kept/S.n).toFixed(0)}% pts,`
      + ` ${(100*(qAll>0?q/qAll:0)).toFixed(1)}% ${quantity().name}`;
}

// ------------------------------------------------------------- colouring --
// Sign-preserving log.  The stored column spans twelve decades in hit mode
// (median 23, 98th percentile 1.3e4, largest 1.8e5) and a third of it is
// negative, so a plain log cannot take it and a linear scale puts three
// quarters of the points within 1.5% of the midpoint.  symlog keeps the
// sign, compresses the magnitude, and stays finite at zero.
const symlog = (v, lin) => Math.sign(v) * Math.log10(1 + Math.abs(v)/lin);
const unsymlog = (t, lin) => Math.sign(t) * (Math.pow(10, Math.abs(t)) - 1) * lin;

// Range from percentiles, not extremes: one 1.8e5 outlier would otherwise
// own the whole ramp.  The legend says when the range is clipped.
function energyRamp(){
  const lg = document.getElementById('logE').checked;
  const raw = [], mags = [];
  let anyNeg = false;
  for(let i = 0; i < S.n; i++){
    if(!S.visible[i]) continue;
    const e = S.feat[i*6+4];
    if(e < 0) anyNeg = true;
    raw.push(e);
    if(e !== 0) mags.push(Math.abs(e));
  }
  if(!raw.length) return {lo:0, hi:1, lg, lin:1, diverging:false, clipped:false};
  // The linear threshold: below this, symlog is effectively linear.  The
  // lower quartile of |value| keeps the bulk of the distribution off the
  // flat part of the curve.
  mags.sort((a,b) => a-b);
  const lin = Math.max(mags.length ? mags[Math.floor(mags.length*0.25)] : 1, 1e-12);

  const vals = lg ? raw.map(v => symlog(v, lin)) : raw.slice();
  vals.sort((a,b) => a-b);
  const q = f => vals[Math.min(vals.length-1, Math.max(0, Math.round(f*(vals.length-1))))];
  let lo = q(0.02), hi = q(0.98);
  const clipped = lo > vals[0] || hi < vals[vals.length-1];
  const diverging = anyNeg;
  if(diverging){ const m = Math.max(Math.abs(lo), Math.abs(hi)); lo = -m; hi = m; }
  if(hi <= lo) hi = lo + 1e-9;
  return {lo, hi, lg, lin, diverging, clipped};
}

function colourOf(i, ramp){
  switch(S.mode){
    case 'energy': {
      let e = S.feat[i*6+4];
      if(ramp.lg) e = symlog(e, ramp.lin);
      const f = Math.min(1, Math.max(0, (e - ramp.lo) / (ramp.hi - ramp.lo)));
      const R = ramp.diverging ? DIV_RGB : SEQ_RGB;
      return R[Math.min(R.length - 1, Math.round(f * (R.length - 1)))];
    }
    case 'sem': {
      const s = semOf(i);
      const j = SEM_ORDER.indexOf(s);
      return j >= 0 ? CAT_RGB[j] : OTHER_RGB;
    }
    case 'pdg': {
      const p = pdgOf(i);
      const c = PDG_COLOR.get(p);
      return c ? hex2rgb(c) : OTHER_RGB;
    }
    case 'frag':  return hashColor(fragOf(i));
    case 'inter': return hashColor(interOf(i));
    default:      return hashColor(instOf(i));
  }
}

function paint(){
  if(!S.n) return;
  const ramp = energyRamp();
  const dimming = S.sel >= 0;

  // Colour every point once; both panes share it, which is what makes a
  // colour mean the same object either side.
  const rgb = new Float32Array(S.n * 3);
  const alpha = new Float32Array(S.n);
  let nSel = 0;
  for(let i = 0; i < S.n; i++){
    const [r, g, b] = colourOf(i, ramp);
    rgb[i*3] = r; rgb[i*3+1] = g; rgb[i*3+2] = b;
    const picked = dimming && S.key[i] === S.sel;
    if(picked) nSel++;
    // Hidden points go transparent rather than being removed, so the two
    // panes keep identical indexing and the picker stays in step.  The
    // selection is handed to the overlay pass, so it is transparent here.
    alpha[i] = !S.visible[i] ? 0 : picked ? 0 : (dimming ? S.dim : 1);
  }

  for(const v of [V.tru, V.nom]){
    if(!v || !v.cloud) continue;
    const col = v.cloud.geometry.attributes.color.array;
    for(let i = 0; i < S.n; i++){
      col[i*4] = rgb[i*3]; col[i*4+1] = rgb[i*3+1]; col[i*4+2] = rgb[i*3+2];
      col[i*4+3] = alpha[i];
    }
    v.cloud.geometry.attributes.color.needsUpdate = true;

    const pts = v === V.tru ? S.ptsTrue : S.ptsNom;
    const sp = new Float32Array(nSel * 3), sc = new Float32Array(nSel * 3);
    let k = 0;
    if(nSel) for(let i = 0; i < S.n; i++){
      if(!(dimming && S.visible[i] && S.key[i] === S.sel)) continue;
      sp[k*3] = pts[i*3]; sp[k*3+1] = pts[i*3+1]; sp[k*3+2] = pts[i*3+2];
      sc[k*3] = rgb[i*3]; sc[k*3+1] = rgb[i*3+1]; sc[k*3+2] = rgb[i*3+2];
      k++;
    }
    const g = v.selCloud.geometry;
    g.setAttribute('position', new THREE.BufferAttribute(sp, 3));
    g.setAttribute('color', new THREE.BufferAttribute(sc, 3));
    g.setDrawRange(0, nSel);
    v.selCloud.material.size = v.cloud.material.size;
    v.selCloud.visible = nSel > 0;
  }
  drawLegend(ramp);
}
const recolour = () => { applyFilter(); paint(); };

function drawLegend(ramp){
  const el = document.getElementById('legend');
  const rows = [];
  const swatch = (c, t) =>
    `<div class="row"><span class="sw" style="background:${c}"></span><span>${t}</span></div>`;
  if(S.mode === 'energy'){
    const ramps = ramp.diverging ? DIV_RGB.map(rgb2css) : SEQ;
    const bar = ramps.map(c =>
      `<span style="background:${c};width:11px;height:11px;display:inline-block"></span>`).join('');
    const f = v => (ramp.lg ? unsymlog(v, ramp.lin) : v).toPrecision(3);
    // The column holds dE in deposit mode and charge in hit mode, and the
    // file does not say which; a negative value can only be the bipolar
    // readout response, so it names itself.
    const what = ramp.diverging ? 'charge (signed)' : 'energy';
    rows.push(`<div class="row"><span>${what}</span></div>`,
              `<div class="row">${bar}</div>`,
              `<div class="row"><span>${f(ramp.lo)} &rarr; ${f(ramp.hi)}</span></div>`);
    if(ramp.clipped)
      rows.push(`<div class="row"><span class="k">range clipped to 2nd&ndash;98th pct</span></div>`);
    if(ramp.diverging)
      rows.push(`<div class="row"><span class="k">symmetric; grey is zero</span></div>`);
    if(ramp.lg)
      rows.push(`<div class="row"><span class="k">log scale, sign kept (symlog)</span></div>`);
  } else if(S.mode === 'sem'){
    for(const v of SEM_ORDER)
      if([...Array(S.n).keys()].length && S.semShow.has(v))
        rows.push(swatch(SEM_COLOR[v], SEM[v] || ('type ' + v)));
  } else if(S.mode === 'pdg'){
    for(const [p, nm] of PDG_ORDER.slice(0, 6)) rows.push(swatch(PDG_COLOR.get(p), nm));
    rows.push(swatch(CAT_OTHER, 'other'));
  } else {
    const what = S.mode === 'frag' ? 'fragment' : S.mode === 'inter' ? 'interaction' : 'instance';
    rows.push(`<div class="row"><span>colour = ${what} id</span></div>`,
              `<div class="row"><span class="k">too many to list; hover to identify</span></div>`);
  }
  el.innerHTML = rows.join('');
}

// ------------------------------------------------------------ 3D panes --
function hostSize(host){
  const r = host.getBoundingClientRect();
  return {w: Math.max(1, Math.round(r.width) || host.clientWidth || innerWidth*0.5),
          h: Math.max(1, Math.round(r.height) || host.clientHeight || innerHeight - 90)};
}
function resizeView(v){
  if(!v || !v.renderer) return;
  const {w, h} = hostSize(v.host);
  v.camera.aspect = w/h; v.camera.updateProjectionMatrix();
  v.renderer.setSize(w, h, false);
}
function makeView(hostId, name){
  const host = document.getElementById(hostId);
  const {w, h} = hostSize(host);
  const v = {host, name, cloud:null};
  v.scene = new THREE.Scene(); v.scene.background = new THREE.Color(0x0e1116);
  v.camera = new THREE.PerspectiveCamera(55, w/h, 0.1, 1e6);
  v.camera.position.set(600,600,600);
  v.renderer = new THREE.WebGLRenderer({antialias:true});
  v.renderer.setPixelRatio(devicePixelRatio);
  v.renderer.setSize(w, h, false);
  host.appendChild(v.renderer.domElement);
  v.controls = new OrbitControls(v.camera, v.renderer.domElement);
  // Pan in the plane of the screen rather than along the ground plane, so
  // dragging up moves the scene up whatever the camera is doing.
  v.controls.screenSpacePanning = true;
  host.addEventListener('pointerenter', () => { ACTIVE = v; });
  v.raycaster = new THREE.Raycaster();
  v.pointer = new THREE.Vector2();
  v.renderer.domElement.addEventListener('mousemove', e => onMove(v, e));
  v.controls.addEventListener('change', () => syncFrom(v));
  new ResizeObserver(() => resizeView(v)).observe(host);
  addEventListener('resize', () => resizeView(v));
  (function tick(){ requestAnimationFrame(tick);
                    v.controls.update(); v.renderer.render(v.scene, v.camera); })();
  log(`3D canvas (${name}) ${w}x${h}`);
  return v;
}

// Camera sync is what makes the two panes comparable: the displacement is
// along x, so the same viewpoint either side is the whole point.
let syncing = false;
function syncFrom(src){
  if(syncing || !document.getElementById('sync').checked) return;
  syncing = true;
  // Copy to every other view rather than to a named sibling: the two
  // viewers call their panes different things, and hard-coding one set of
  // names into shared code is how this silently stopped working once.
  for(const dst of Object.values(V)){
    if(!dst || dst === src || !dst.camera) continue;
    dst.camera.position.copy(src.camera.position);
    dst.camera.up.copy(src.camera.up);
    dst.controls.target.copy(src.controls.target);
    dst.camera.updateProjectionMatrix();
    dst.controls.update();
  }
  syncing = false;
}

// Which pane the cursor is over, so the arrow keys move that one.
let ACTIVE = null;

// OrbitControls pans on right-drag, which not everyone finds.  This is the
// same screen-space translation bound to the arrow keys: shift both the
// camera and its target by the same vector, so the view slides without
// turning.
function panView(v, dxPix, dyPix){
  if(!v) return;
  const el = v.renderer.domElement;
  const dist = new THREE.Vector3()
      .subVectors(v.camera.position, v.controls.target).length();
  const half = dist * Math.tan((v.camera.fov / 2) * Math.PI / 180);
  const sx = 2 * dxPix * half / Math.max(1, el.clientHeight);
  const sy = 2 * dyPix * half / Math.max(1, el.clientHeight);
  const m = v.camera.matrix.elements;
  const right = new THREE.Vector3(m[0], m[1], m[2]).multiplyScalar(-sx);
  const up    = new THREE.Vector3(m[4], m[5], m[6]).multiplyScalar(sy);
  const d = right.add(up);
  v.camera.position.add(d);
  v.controls.target.add(d);
  v.controls.update();
  syncFrom(v);
}

const PAN_KEYS = {ArrowLeft:[-1,0], ArrowRight:[1,0],
                  ArrowUp:[0,1], ArrowDown:[0,-1]};
addEventListener('keydown', e => {
  const k = PAN_KEYS[e.key];
  if(!k) return;
  const v = ACTIVE || Object.values(V).find(x => x);
  if(!v) return;
  e.preventDefault();
  const step = (e.shiftKey ? 160 : 40);
  panView(v, k[0] * step, k[1] * step);
});

function buildCloud(v, pts){
  if(v.cloud){ v.scene.remove(v.cloud); v.cloud.geometry.dispose();
               v.cloud.material.dispose(); v.cloud = null; }
  if(v.selCloud){ v.scene.remove(v.selCloud); v.selCloud.geometry.dispose();
                  v.selCloud.material.dispose(); v.selCloud = null; }
  const n = pts ? pts.length/3 : 0;
  if(!n) return;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pts, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n*4), 4));
  // alphaTest discards the fully transparent points outright, so a class
  // hidden by the filter cannot write depth and punch holes in what is left.
  const mat = new THREE.PointsMaterial({size:+document.getElementById('psize').value,
                                        vertexColors:true, sizeAttenuation:false,
                                        transparent:true, depthWrite:true,
                                        alphaTest:0.01});
  v.cloud = new THREE.Points(geo, mat); v.scene.add(v.cloud);

  // A second pass holding just the selection.  One cloud cannot do both
  // jobs: with depthWrite on, a faint point in front discards the selected
  // point behind it; with depthWrite off, a third of a million faint points
  // sum into a wash and the selection stops reading at all.  So the bulk
  // writes depth and stays crisp, and this draws over the top of it with
  // depthTest off.
  const selGeo = new THREE.BufferGeometry();
  selGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(0), 3));
  selGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(0), 3));
  v.selCloud = new THREE.Points(selGeo, new THREE.PointsMaterial({
    size:+document.getElementById('psize').value, vertexColors:true,
    sizeAttenuation:false, depthTest:false, depthWrite:false}));
  v.selCloud.renderOrder = 2;
  v.scene.add(v.selCloud);
}

function fitOne(v, pts){
  if(!v || !pts || !pts.length) return;
  const n = pts.length/3;
  let mn = [1e30,1e30,1e30], mx = [-1e30,-1e30,-1e30];
  for(let i = 0; i < n; i++) for(let d = 0; d < 3; d++){
    const q = pts[i*3+d]; if(q < mn[d]) mn[d] = q; if(q > mx[d]) mx[d] = q;
  }
  const c = mn.map((q,i) => (q + mx[i])/2);
  const span = Math.max(...mx.map((q,i) => q - mn[i]), 1);
  v.controls.target.set(c[0],c[1],c[2]);
  v.camera.position.set(c[0]+span, c[1]+span*0.7, c[2]+span);
  v.camera.near = span/1000; v.camera.far = span*20;
  v.camera.updateProjectionMatrix();
  v.raycaster.params.Points.threshold = Math.max(span/250, 1e-6);
  v.controls.update();
}
function fitView(){
  // Both panes are framed on the union, so a displacement reads as a
  // displacement rather than being normalised away by two separate fits.
  const both = new Float32Array((S.ptsTrue?.length || 0) + (S.ptsNom?.length || 0));
  if(S.ptsTrue) both.set(S.ptsTrue, 0);
  if(S.ptsNom)  both.set(S.ptsNom, S.ptsTrue ? S.ptsTrue.length : 0);
  fitOne(V.tru, both); fitOne(V.nom, both);
}

function onMove(v, e){
  if(!v.cloud || !S.n) return;
  const r = v.renderer.domElement.getBoundingClientRect();
  v.pointer.x = ((e.clientX - r.left)/r.width)*2 - 1;
  v.pointer.y = -((e.clientY - r.top)/r.height)*2 + 1;
  v.raycaster.setFromCamera(v.pointer, v.camera);
  const hits = v.raycaster.intersectObject(v.cloud, false);
  for(const h of hits){
    if(!S.visible[h.index]) continue;      // never pick something filtered out
    infoPoint(h.index, v.name);
    select(S.key[h.index]);
    return;
  }
}

const fmt = (x, d=3) => (x === undefined || x === null || Number.isNaN(x))
  ? '—' : (Math.abs(x) >= 1e5 || (x !== 0 && Math.abs(x) < 1e-3)
                 ? Number(x).toExponential(2) : Number(x).toFixed(d));
const pdgName = p => PDG_NAME.has(p) ? `${p} (${PDG_NAME.get(p)})` : (p === -1 ? '—' : String(p));

function infoPoint(i, where){
  const ir = S.instRow[i], fr = S.fragRow[i], pr = S.partRow[i];
  // geant4 track id belongs to a particle, and only about two thirds of
  // points fall inside a stored particle row; the rest fall back to the
  // fragment's representative, and say so rather than implying precision.
  let g4 = '—';
  if(pr >= 0 && S.cols.geant4_trackid) g4 = String(Number(S.cols.geant4_trackid[pr]));
  else if(fr >= 0 && S.cols.geant4_trackid)
    g4 = `${Number(S.cols.geant4_trackid[fr])} <span class="k">(fragment rep)</span>`;

  const parentInst = attrOf(ir, 'inst_parent_id');
  // A primary is its own parent in this table; printing "parent 9" of
  // instance 9 reads as a real ancestor, so say what it means instead.
  const isPrimary = parentInst >= 0 && parentInst === instOf(i);
  const prow = S.idRow.has(parentInst) ? S.idRow.get(parentInst) : -1;
  const parentPdg = isPrimary ? -1
    : (prow >= 0 ? Number(S.cols.pdg[prow]) : attrOf(ir, 'parent_pdg'));

  const sem = semOf(i);
  const rows = [
    ['point', `${i.toLocaleString()} <span class="k">(${where})</span>`],
    ['x y z (inferred)', `${fmt(S.feat[i*6],1)}  ${fmt(S.feat[i*6+1],1)}  ${fmt(S.feat[i*6+2],1)}`],
    ['x (true)', `${fmt(S.feat[i*6] + S.shift[i], 1)} <span class="k">shift ${fmt(S.shift[i],1)}</span>`],
    [quantity().name, fmt(S.feat[i*6+4], 4)
       + (quantity().unit ? ' ' + quantity().unit : '')],
    ['geant4 track id', g4],
    ['fragment id', fragOf(i) < 0 ? '—' : String(fragOf(i))],
    ['instance id', instOf(i) < 0 ? '—' : String(instOf(i))],
    ['interaction id', interOf(i) < 0 ? '—' : String(interOf(i))],
    ['semantic type', SEM[sem] ? `${SEM[sem]} <span class="k">(${sem})</span>` : '—'],
    ['low energy', S.isLE[i] ? 'yes <span class="k">(in the instance\u2019s LE block)</span>' : 'no'],
    ['instance type', SEM[hostSemOf(i)] || '—'],
    ['pdg', pdgName(pdgOf(i))],
    ['parent instance', isPrimary ? '— <span class="k">(primary)</span>'
                                  : parentInst < 0 ? '—' : String(parentInst)],
    ['parent pdg', isPrimary ? '—' : pdgName(parentPdg)],
  ];
  const el = document.getElementById('pinfo');
  el.innerHTML = '<table>' + rows.map(([k,v]) =>
    `<tr><td>${k}</td><td>${v}</td></tr>`).join('') + '</table>';
  el.style.display = 'block';
}

// One key drives both panes; that is the link being demonstrated.
function select(key){
  key = Number(key);
  if(key === S.sel) return;
  S.sel = key;
  paint();
  let n = 0; for(let i = 0; i < S.n; i++) if(S.key[i] === key && S.visible[i]) n++;
  const lvl = S.hl === 'frag' ? 'fragment' : S.hl === 'inter' ? 'interaction' : 'instance';
  statusEl.innerHTML = key < 0
    ? `<span class="k">unowned point</span>`
    : `<b>${lvl} ${key}</b>   <span class="k">points</span> <span class="v">${n.toLocaleString()}</span>`;
}

// ----------------------------------------------------------------- rebuild --
function rebuild(){
  if(!S.out) return;
  if(!V.tru) V.tru = makeView('pane-true', 'true x');
  if(!V.nom) V.nom = makeView('pane-nom', 'inferred x');
  S.sel = -1;
  try{
    buildEvent();
    buildCloud(V.tru, S.ptsTrue);
    buildCloud(V.nom, S.ptsNom);
    resizeView(V.tru); resizeView(V.nom);
    paint();
    fitView();
    let spread = 0;
    for(let i = 0; i < S.n; i++) spread = Math.max(spread, Math.abs(S.shift[i]));
    banner('note', !S.hasShift
      ? `This output has no points/true_x_shift, so the two panes are the same cloud.\n` +
        `It predates the column, or was written from truth deposits rather than hits.`
      : spread === 0
      ? `Every true_x_shift in this event is zero, so the two panes are the same cloud.\n` +
        `That is what a deposit-mode run, or hit mode with hit_x_from=true_t0, writes.`
      : '');
    log(`event ${S.ev}: ${S.n.toLocaleString()} points, ` +
        `max |shift| ${spread.toFixed(0)} mm`);
    statusEl.innerHTML =
      `<b>event ${S.ev}</b>   <span class="k">points</span> <span class="v">${S.n.toLocaleString()}</span>` +
      (spread ? `   <span class="k">max drift shift</span> <span class="v">${spread.toFixed(0)} mm</span>` : '');
    document.getElementById('hint').textContent = 'hover a point in either pane · drag rotate · right-drag or arrows pan · c fit';
  }catch(err){ log('ERROR: ' + err.message); statusEl.textContent = 'error: ' + err.message; }
}
</script>
