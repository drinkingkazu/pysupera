<!DOCTYPE html>
<meta charset="utf-8">
<title>pysupera — pixel truth ⇄ hits</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#2a313a;
    --text:#d8dee9; --text2:#8b949e; --accent:#58a6ff;
    --cat-1:#3987e5; --cat-2:#d95926; --cat-3:#199e70;
    --cat-4:#c98500; --cat-5:#d55181; --cat-6:#008300; --cat-other:#6e7681;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 ui-sans-serif,system-ui,sans-serif;height:100vh;display:flex;flex-direction:column}
  header{padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:13px;align-items:center;flex-wrap:wrap}
  label{color:var(--text2);font-size:12px}
  input[type=file]{font-size:11px;color:var(--text2);max-width:220px}
  select,button{background:#21262d;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:3px 8px;font-size:12px}
  button:hover{border-color:var(--accent);cursor:pointer}
  #filters{padding:5px 12px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--text2)}
  #filters label{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
  .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
  main{flex:1;display:flex;min-height:0}
  .pane{flex:1;min-width:0;position:relative;overflow:hidden}
  .pane + .pane{border-left:1px solid var(--line)}
  .pane canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .ttl{position:absolute;left:10px;top:9px;z-index:4;background:rgba(13,17,23,.9);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:11px;color:var(--text2);white-space:pre-wrap}
  .ttl b{color:var(--text)}
  #banner{position:absolute;left:10px;right:10px;top:44px;background:#5a1d1d;border:1px solid #a33;border-radius:6px;padding:8px 10px;font-size:12px;display:none;z-index:6;white-space:pre-wrap}
  #pinfo{position:absolute;right:10px;bottom:10px;background:rgba(13,17,23,.95);border:1px solid var(--line);border-radius:6px;padding:8px 11px;font-size:12px;z-index:4;display:none;font-variant-numeric:tabular-nums}
  #pinfo table{border-collapse:collapse} #pinfo td{padding:1px 0}
  #pinfo td:first-child{color:var(--text2);padding-right:14px}
  #legend{position:absolute;left:10px;bottom:10px;background:rgba(13,17,23,.92);border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:11px;z-index:4;max-height:44%;overflow:auto}
  #legend .row{display:flex;align-items:center;gap:6px;margin:2px 0}
  #status{position:absolute;right:10px;top:9px;background:rgba(13,17,23,.9);border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:11px;color:var(--text2);z-index:4;white-space:pre-wrap;max-width:46%}
  #log{position:absolute;right:10px;bottom:10px;background:rgba(13,17,23,.9);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:11px;color:var(--text2);max-height:28%;overflow:auto;max-width:60%;z-index:3}
  .k{color:var(--text2)} .v{color:var(--text)} b{color:var(--accent)}
</style>
<header>
  <label>output .h5 <input type="file" id="f-out" accept=".h5"></label>
  <label>hits subset .h5 <input type="file" id="f-hit" accept=".h5"></label>
  <label>event <select id="ev"></select></label>
  <label>colour by
    <select id="mode">
      <option value="energy">energy / charge</option>
      <option value="sem">semantic type</option>
      <option value="frag">fragment id</option>
      <option value="inst" selected>instance id</option>
      <option value="inter">interaction id</option>
      <option value="pdg">particle type (PDG)</option>
    </select>
  </label>
  <label>highlight
    <select id="hl">
      <option value="inst" selected>instance</option>
      <option value="frag">fragment</option>
      <option value="inter">interaction</option>
    </select>
  </label>
  <label>point size <input type="range" id="psize" min="1" max="8" step="0.5" value="2.5" style="width:70px"></label>
  <label>others <input type="range" id="dim" min="0" max="1" step="0.01" value="0.03" style="width:80px"><span id="dimv" class="k">0.03</span></label>
  <label><input type="checkbox" id="logE" checked> log scale</label>
  <label><input type="checkbox" id="sync" checked> sync cameras</label>
  <label><input type="checkbox" id="offsensor"> off-sensor hits</label>
  <label>show &ge; <input type="range" id="thr" min="0" max="99" step="1" value="0" style="width:90px"><span id="thrv" class="k">all</span></label>
  <button id="fit">fit (c)</button>
  <span id="hint" class="k">load the output and its hits subset — hover a point to follow it across both views</span>
</header>
<div id="filters"><span>show semantic type:</span></div>

<main>
  <div class="pane" id="pane-true">
    <div class="ttl"><b>truth</b>   points/flat · the energy deposits, true x</div>
    <div id="banner"></div><div id="legend"></div><div id="log"></div>
  </div>
  <div class="pane" id="pane-hit">
    <div class="ttl" id="hit-ttl"><b>hits</b>   the JAXTPC hits · inferred x (t0 = tick 0)</div>
    <div id="status">no file loaded</div><div id="pinfo"></div>
  </div>
</main>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// What this shows.  Left: points/flat -- the true energy deposits behind the
// hits, at their true position.  Right: the JAXTPC hits themselves, placed
// where a detector would put them -- the drift coordinate inferred from the
// tick with the interaction assumed at tick 0 -- each labelled by
// hit_labels/.  The two clouds are different points; what links them is the
// pysupera particle each belongs to, so hovering either side highlights that
// instance (or fragment, or interaction) in both.
//
// Inputs, both gzip:
//   the pysupera output      pysupera-repack out.h5 out_gz.h5 -c gzip
//   the JAXTPC hits file     pysupera-hits-subset hits.h5 hits_small.h5 -n 2
// or, served over http:  vis_drift.html?out=out_gz.h5&hits=hits_small.h5

// ---------------------------------------------------------------- state --
const S = {
  out:null, hit:null, ev:0, nEvents:0,
  T:null, H:null,               // the two point sets; see pointSet()
  sel:-1, dim:0.03, thrPct:0,
  mode:'inst', hl:'inst',
  cols:null, idRow:null,        // particle columns for the event, id -> row
  semShow:new Set(),
  geom:null,                    // per-volume pixel geometry (output attribute)
  ncol:6,
};
let H5File, FS;
const V = {tru:null, hit:null};

const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const log = m => { logEl.textContent = (m + '\n' + logEl.textContent).slice(0, 3000); };
function banner(msg){
  const el = document.getElementById('banner');
  el.style.display = msg ? 'block' : 'none';
  if(msg){ el.textContent = msg; log(msg.split('\n')[0]); }
}

// ------------------------------------------------------------- palette --
// Categorical slots in a fixed order; a seventh category folds into "other".
// Identity is never carried by colour alone: a legend is always up, classes
// can be isolated with the filter strip, and the hover panel names them.
const CAT = ['#3987e5','#d95926','#199e70','#c98500','#d55181','#008300'];
const CAT_OTHER = '#6e7681';
const SEM = {1:'shower', 2:'track', 3:'delta', 4:'Michel', 5:'LE scatter', 6:'unknown'};
const SEM_ORDER = [2, 1, 3, 4, 5, 6];
const SEM_COLOR = {}; SEM_ORDER.forEach((v, i) => { SEM_COLOR[v] = CAT[i]; });
const SEM_LE = 5;
const PDG_ORDER = [[13,'mu-'], [-13,'mu+'], [11,'e-'], [-11,'e+'], [22,'gamma'],
                   [2212,'proton'], [2112,'neutron'], [211,'pi+'], [-211,'pi-']];
const PDG_NAME = new Map(PDG_ORDER);
const PDG_COLOR = new Map(); PDG_ORDER.slice(0, 6).forEach(([p], i) => PDG_COLOR.set(p, CAT[i]));
const SEQ = ['#0d366b','#104281','#184f95','#1c5cab','#256abf','#2a78d6',
             '#3987e5','#5598e7','#6da7ec','#86b6ef','#9ec5f4','#b7d3f6','#cde2fb'];
const DIV_NEG = '#3987e5', DIV_MID = '#383835', DIV_POS = '#e34948';
const hex2rgb = h => [parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255];
const lerpHex = (a, b, f) => { const A = hex2rgb(a), B = hex2rgb(b); return A.map((x, i) => x + (B[i]-x)*f); };
const CAT_RGB = CAT.map(hex2rgb), SEQ_RGB = SEQ.map(hex2rgb), OTHER_RGB = hex2rgb(CAT_OTHER);
const DIV_RGB = (() => { const n = 6, out = [];
  for(let i = n; i > 0; i--) out.push(lerpHex(DIV_NEG, DIV_MID, 1 - i/n));
  out.push(hex2rgb(DIV_MID));
  for(let i = 1; i <= n; i++) out.push(lerpHex(DIV_MID, DIV_POS, i/n));
  return out; })();
const rgb2css = c => `rgb(${c.map(v => Math.round(v*255)).join(',')})`;
// Ids run to thousands; a stable hash keeps one object one colour in both
// panes, and the hover highlight carries identity.
function hashColor(id){
  if(id < 0) return [0.30,0.33,0.38];
  const h = Math.imul(id ^ 0x9e3779b9, 0x85ebca6b) >>> 0;
  const c = new THREE.Color().setHSL((h % 360)/360, 0.62, 0.60);
  return [c.r, c.g, c.b];
}

// ------------------------------------------------------------ h5 helpers --
function attr(f, path, name){
  try{ const a = f.get(path).attrs[name];
       if(a === undefined || a === null) return null;
       return (typeof a === 'object' && 'value' in a) ? a.value : a; }catch(e){ return null; }
}
const has = (f,p) => { try { return f.get(p) !== null; } catch(e){ return false; } };
const val = (f,p) => f.get(p).value;
const sl  = (f,p,a,b) => f.get(p).slice([[a,b]]);
const READABLE = new Set(['1','2','3','4','5','6']);
function filterIds(d){
  const f = d && d.filters;
  if(!f) return [];
  if(Array.isArray(f)) return f.map(x => String(x && x.id !== undefined ? x.id : x));
  if(typeof f === 'object') return Object.keys(f).map(String);
  return [];
}
function unreadableFilter(f, path){
  try{ const bad = filterIds(f.get(path)).filter(i => !READABLE.has(i));
       return bad.length ? bad.join(',') : null; }catch(e){ return null; }
}

// --------------------------------------------------------------- loading --
async function boot(){
  const h5wasm = (await import('https://cdn.jsdelivr.net/npm/h5wasm@0.7.3/dist/esm/hdf5_hl.js')).default;
  const Module = await h5wasm.ready;
  H5File = h5wasm.File; FS = Module.FS;
  log('h5wasm ready');
}
const booted = boot();
async function openBytes(buf, tag){ await booted; FS.writeFile(tag, new Uint8Array(buf)); return new H5File(tag, 'r'); }

async function loadOut(buf, name){
  S.out = await openBytes(buf, 'out.h5');
  S.nEvents = Number(val(S.out, 'n_events'));
  log(`output: format ${val(S.out,'format_version')}, ${S.nEvents} events`);
  const bad = unreadableFilter(S.out, 'points/flat');
  if(bad){ S.out = null;
    return banner(`This output uses HDF5 filter ${bad}, which the browser cannot decode.\n` +
                  `    pysupera-repack ${name} out_gz.h5 -c gzip`); }
  if(String(attr(S.out, '/', 'readout_type')) === 'wire')
    return banner('This is a wire-readout output.  Open it in vis_hits.html instead.');
  const g = attr(S.out, '/', 'pixel_geometry');
  S.geom = g ? JSON.parse(String(g)) : null;
  banner(!has(S.out, 'hit_labels') ? 'This output has no hit_labels/ -- the hits cannot be labelled.'
         : !S.geom ? 'This output records no pixel_geometry, so the hits cannot be placed.\n' +
                     'Re-run it with a pysupera that writes the attribute.' : '');
  const sel = document.getElementById('ev'); sel.innerHTML = '';
  for(let i = 0; i < S.nEvents; i++){
    const o = document.createElement('option'); o.value = i; o.textContent = i; sel.appendChild(o);
  }
  rebuild();
}
async function loadHits(buf, name){
  S.hit = await openBytes(buf, 'hits.h5');
  if(String(attr(S.hit, 'config', 'readout_type')) === 'wire')
    return banner('This hits file is a wire readout.  Open it in vis_hits.html instead.');
  const ek = S.hit.keys().filter(k => k.startsWith('event_')).sort();
  if(ek.length && !has(S.hit, `${ek[0]}/volume_0/Pixel/hit_py`))
    return banner(`This hits file has no decoded hits.  Make it with\n` +
                  `    pysupera-hits-subset <JAXTPC hits file> ${name} -n 2`);
  log(`hits: ${ek.length} events`);
  rebuild();
}
document.getElementById('f-out').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{ await loadOut(await f.arrayBuffer(), f.name); }catch(err){ log('ERROR opening output: ' + err.message); }
};
document.getElementById('f-hit').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{ await loadHits(await f.arrayBuffer(), f.name); }catch(err){ log('ERROR opening hits: ' + err.message); }
};
(async () => {
  const q = new URLSearchParams(location.search);
  try{
    if(q.get('out'))  await loadOut(await (await fetch(q.get('out'))).arrayBuffer(), q.get('out'));
    if(q.get('hits')) await loadHits(await (await fetch(q.get('hits'))).arrayBuffer(), q.get('hits'));
  }catch(err){ log('ERROR fetching: ' + err.message); }
})();

document.getElementById('ev').onchange   = e => { S.ev = +e.target.value; rebuild(); };
document.getElementById('mode').onchange = e => { S.mode = e.target.value; recolour(); };
document.getElementById('hl').onchange   = e => { S.hl = e.target.value; S.sel = -1; buildKeys(); recolour(); };
document.getElementById('logE').onchange = () => recolour();
document.getElementById('offsensor').onchange = () => rebuild();
document.getElementById('psize').oninput = e => {
  for(const v of Object.values(V)) if(v && v.cloud){ v.cloud.material.size = +e.target.value;
                                                      v.selCloud.material.size = +e.target.value; }
};
document.getElementById('dim').oninput = e => {
  S.dim = +e.target.value; document.getElementById('dimv').textContent = S.dim.toFixed(2); paint();
};
document.getElementById('thr').oninput = e => { S.thrPct = +e.target.value; recolour(); };
document.getElementById('fit').onclick = () => fitView();
addEventListener('keydown', e => { if(e.key === 'c') fitView(); });

// ------------------------------------------------------ the two point sets --
// A point set is {name, n, pts (xyz), e (energy column), inst, frag (owner
// ids), le}, plus what paint/pick fill in.  Everything below works on either.
function pointSet(name, n){
  return {name, n, pts:new Float32Array(n*3), e:new Float32Array(n),
          inst:new Int32Array(n).fill(-1), frag:new Int32Array(n).fill(-1),
          le:new Uint8Array(n), key:null, visible:null, extra:{}};
}

function buildParticles(){
  const f = S.out, ev = S.ev, eo = val(f,'events/offsets');
  const a = Number(eo[ev]), b = Number(eo[ev+1]);
  const g = f.get('particles');
  const col = nm => g.keys().includes(nm) ? sl(f,'particles/'+nm, a, b) : null;
  const c = {};
  for(const k of ['id','inst_id','frag_id','interaction_id','pdg','geant4_trackid','inst_sem_type',
                  'inst_parent_id','inst_pc_start','inst_pc_end','inst_pc_le_start','inst_pc_le_end',
                  'frag_pc_start','frag_pc_end','frag_pc_le_start','frag_pc_le_end'])
    c[k] = col(k);
  S.cols = c; S.idRow = new Map();
  for(let k = 0; k < c.id.length; k++) S.idRow.set(Number(c.id[k]), k);
}

// Truth: points/flat, labels from the ranges (ownership is positional).
function buildTruth(){
  const f = S.out, ev = S.ev, po = val(f,'points/offsets');
  const pa = Number(po[ev]), pb = Number(po[ev+1]), n = Math.max(0, pb - pa);
  S.ncol = Number(f.get('points/flat').shape[1]);
  const T = pointSet('truth', n);
  if(!n){ S.T = T; return; }
  const C = S.ncol, flat = f.get('points/flat').slice([[pa, pb], [0, C]]);
  T.feat = Float32Array.from(flat); T.C = C;
  for(let i = 0; i < n; i++){ T.pts[i*3] = flat[i*C]; T.pts[i*3+1] = flat[i*C+1]; T.pts[i*3+2] = flat[i*C+2];
                               T.e[i] = flat[i*C+4]; }
  const c = S.cols;
  const fill = (arr, s, e, v) => { s = Number(s); if(s < 0) return;
    for(let j = Math.max(0, s - pa); j < Math.min(n, Number(e) - pa); j++) arr[j] = v; };
  for(let k = 0; k < c.id.length; k++){
    const id = Number(c.id[k]);
    if(Number(c.inst_id[k]) === id){
      fill(T.inst, c.inst_pc_start[k], c.inst_pc_end[k], id);
      fill(T.inst, c.inst_pc_le_start[k], c.inst_pc_le_end[k], id);
      fill(T.le, c.inst_pc_le_start[k], c.inst_pc_le_end[k], 1);
    }
    if(Number(c.frag_id[k]) === id){
      fill(T.frag, c.frag_pc_start[k], c.frag_pc_end[k], id);
      fill(T.frag, c.frag_pc_le_start[k], c.frag_pc_le_end[k], id);
    }
  }
  S.T = T;
}

// Hits: the subset's decoded hits, labelled entry for entry by hit_labels,
// placed at the inferred drift position with the output's pixel geometry.
function buildHits(){
  S.H = pointSet('hits', 0);
  if(!S.hit || !S.geom || !has(S.out, 'hit_labels')) return;
  const ekey = 'event_' + String(S.ev).padStart(3, '0');
  if(!S.hit.keys().includes(ekey)){ log(`hits subset has no ${ekey}`); return; }
  const off = document.getElementById('offsensor').checked;
  const parts = [];
  for(const vk of S.out.get('hit_labels').keys()){
    for(const pk of S.out.get('hit_labels').get(vk).keys()){
      const gp = `hit_labels/${vk}/${pk}`;
      const vol = Number(attr(S.out, gp, 'volume')), src = String(attr(S.out, gp, 'source'));
      const hp = `${ekey}/volume_${vol}/${src}`;
      if(!has(S.hit, `${hp}/hit_py`)) continue;
      const o = val(S.out, `${gp}/offsets`), a = Number(o[S.ev]), b = Number(o[S.ev+1]);
      const lab = {frag: sl(S.out, `${gp}/fragment_id`, a, b), inst: sl(S.out, `${gp}/instance_id`, a, b),
                   le: sl(S.out, `${gp}/is_le`, a, b),
                   on: has(S.out, `${gp}/on_sensor`) ? sl(S.out, `${gp}/on_sensor`, a, b) : null};
      const hit = {py: val(S.hit, `${hp}/hit_py`), pz: val(S.hit, `${hp}/hit_pz`),
                   tick: val(S.hit, `${hp}/hit_tick`), q: val(S.hit, `${hp}/hit_charge`)};
      if(hit.py.length !== lab.frag.length){
        banner(`${hp}: ${hit.py.length} hits but ${lab.frag.length} labels -- the hits subset\n` +
               `and the output are not from the same JAXTPC run.`); continue; }
      parts.push({vol, src, lab, hit, g: S.geom[vol]});
    }
  }
  let n = 0;
  for(const p of parts){ for(let h = 0; h < p.lab.frag.length; h++) if(off || !p.lab.on || Number(p.lab.on[h])) n++; }
  const H = pointSet('hits', n);
  H.vol = new Int8Array(n); H.src = new Int32Array(n); H.py = new Int16Array(n); H.pz = new Int16Array(n);
  H.tick = new Int16Array(n); H.on = new Uint8Array(n);
  let k = 0;
  for(const p of parts){
    const g = p.g;
    for(let h = 0; h < p.lab.frag.length; h++){
      const on = !p.lab.on || Number(p.lab.on[h]);
      if(!off && !on) continue;
      const py = p.hit.py[h], pz = p.hit.pz[h], t = p.hit.tick[h];
      H.pts[k*3]   = g.x_anode_mm - g.drift_direction * (t - g.reference_tick) * g.mm_per_tick;
      H.pts[k*3+1] = g.y_min_mm + (py + 0.5) * g.pitch_mm;
      H.pts[k*3+2] = g.z_min_mm + (pz + 0.5) * g.pitch_mm;
      H.e[k] = p.hit.q[h];
      H.frag[k] = Number(p.lab.frag[h]); H.inst[k] = Number(p.lab.inst[h]); H.le[k] = Number(p.lab.le[h]) ? 1 : 0;
      H.vol[k] = p.vol; H.src[k] = h; H.py[k] = py; H.pz[k] = pz; H.tick[k] = t; H.on[k] = on ? 1 : 0;
      k++;
    }
  }
  S.H = H;
}

const rowOf = id => (id >= 0 && S.idRow.has(id)) ? S.idRow.get(id) : -1;
const colOf = (id, key) => { const r = rowOf(id); return (r >= 0 && S.cols[key]) ? Number(S.cols[key][r]) : -1; };
const semOf = (P, i) => P.le[i] ? SEM_LE : colOf(P.inst[i], 'inst_sem_type');
const interOf = (P, i) => colOf(P.inst[i], 'interaction_id');
const pdgOf = (P, i) => colOf(P.inst[i], 'pdg');

function buildKeys(){
  for(const P of [S.T, S.H]){
    if(!P) continue;
    const k = new Int32Array(P.n);
    for(let i = 0; i < P.n; i++)
      k[i] = S.hl === 'frag' ? P.frag[i] : S.hl === 'inter' ? interOf(P, i) : P.inst[i];
    P.key = k;
  }
}

function buildFilters(){
  const host = document.getElementById('filters');
  host.innerHTML = '<span>show semantic type:</span>';
  const present = new Set();
  for(const P of [S.T, S.H]) for(let i = 0; i < P.n; i++) present.add(semOf(P, i));
  S.semShow = new Set(present);
  for(const v of SEM_ORDER){
    if(!present.has(v)) continue;
    const lab = document.createElement('label'), cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = true;
    cb.onchange = () => { cb.checked ? S.semShow.add(v) : S.semShow.delete(v); recolour(); };
    const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = SEM_COLOR[v] || CAT_OTHER;
    lab.append(cb, sw, document.createTextNode(SEM[v] || ('type ' + v)));
    host.appendChild(lab);
  }
}

// Filtering hides at paint time; the picker consults it too, so nothing
// hidden can be selected.  The display cut is a percentile of |value|, per
// cloud: MeV on the left and ADC on the right are not one scale.
function applyFilter(){
  const parts = [];
  for(const P of [S.T, S.H]){
    let thr = 0;
    if(S.thrPct > 0 && P.n){
      const a = Float32Array.from(P.e, Math.abs).sort();
      thr = a[Math.min(a.length - 1, Math.floor(S.thrPct/100 * a.length))];
    }
    const vis = new Uint8Array(P.n); let kept = 0;
    for(let i = 0; i < P.n; i++){ const pass = S.semShow.has(semOf(P, i)) && Math.abs(P.e[i]) >= thr;
                                  vis[i] = pass ? 1 : 0; if(pass) kept++; }
    P.visible = vis; P.thr = thr;
    if(S.thrPct > 0) parts.push(`${P.name} ≥ ${fmt(thr, 3)} (${P.n ? (100*kept/P.n).toFixed(0) : 0}%)`);
  }
  document.getElementById('thrv').textContent = S.thrPct <= 0 ? 'all' : parts.join(' · ');
}

// ------------------------------------------------------------- colouring --
const symlog = (v, lin) => Math.sign(v) * Math.log10(1 + Math.abs(v)/lin);
const unsymlog = (t, lin) => Math.sign(t) * (Math.pow(10, Math.abs(t)) - 1) * lin;
function energyRamp(P){
  const lg = document.getElementById('logE').checked;
  const raw = [], mags = []; let anyNeg = false;
  for(let i = 0; i < P.n; i++){ if(!P.visible[i]) continue; const e = P.e[i];
    if(e < 0) anyNeg = true; raw.push(e); if(e !== 0) mags.push(Math.abs(e)); }
  if(!raw.length) return {lo:0, hi:1, lg, lin:1, diverging:false, clipped:false};
  mags.sort((a, b) => a - b);
  const lin = Math.max(mags.length ? mags[Math.floor(mags.length*0.25)] : 1, 1e-12);
  const vals = (lg ? raw.map(v => symlog(v, lin)) : raw.slice()).sort((a, b) => a - b);
  const q = f => vals[Math.min(vals.length-1, Math.max(0, Math.round(f*(vals.length-1))))];
  let lo = q(0.02), hi = q(0.98);
  const clipped = lo > vals[0] || hi < vals[vals.length-1];
  if(anyNeg){ const m = Math.max(Math.abs(lo), Math.abs(hi)); lo = -m; hi = m; }
  if(hi <= lo) hi = lo + 1e-9;
  return {lo, hi, lg, lin, diverging:anyNeg, clipped};
}
function colourOf(P, i, ramp){
  switch(S.mode){
    case 'energy': {
      let e = P.e[i]; if(ramp.lg) e = symlog(e, ramp.lin);
      const f = Math.min(1, Math.max(0, (e - ramp.lo) / (ramp.hi - ramp.lo)));
      const R = ramp.diverging ? DIV_RGB : SEQ_RGB;
      return R[Math.min(R.length - 1, Math.round(f * (R.length - 1)))];
    }
    case 'sem': { const j = SEM_ORDER.indexOf(semOf(P, i)); return j >= 0 ? CAT_RGB[j] : OTHER_RGB; }
    case 'pdg': { const c = PDG_COLOR.get(pdgOf(P, i)); return c ? hex2rgb(c) : OTHER_RGB; }
    case 'frag':  return hashColor(P.frag[i]);
    case 'inter': return hashColor(interOf(P, i));
    default:      return hashColor(P.inst[i]);
  }
}

function paintSet(v, P){
  if(!v || !v.cloud || !P.n) return null;
  // The ramp sorts every value, so it is computed when the colouring or the
  // filter changes, not on every hover.
  if(!P.ramp) P.ramp = energyRamp(P);
  const ramp = P.ramp, dimming = S.sel >= 0;
  const col = v.cloud.geometry.attributes.color.array;
  let nSel = 0;
  const rgb = new Float32Array(P.n * 3);
  for(let i = 0; i < P.n; i++){
    const [r, g, b] = colourOf(P, i, ramp);
    rgb[i*3] = r; rgb[i*3+1] = g; rgb[i*3+2] = b;
    const picked = dimming && P.visible[i] && P.key[i] === S.sel; if(picked) nSel++;
    col[i*4] = r; col[i*4+1] = g; col[i*4+2] = b;
    col[i*4+3] = !P.visible[i] ? 0 : picked ? 0 : (dimming ? S.dim : 1);
  }
  v.cloud.geometry.attributes.color.needsUpdate = true;
  const sp = new Float32Array(nSel * 3), sc = new Float32Array(nSel * 3); let k = 0;
  if(nSel) for(let i = 0; i < P.n; i++){
    if(!(P.visible[i] && P.key[i] === S.sel)) continue;
    for(let d = 0; d < 3; d++){ sp[k*3+d] = P.pts[i*3+d]; sc[k*3+d] = rgb[i*3+d]; } k++;
  }
  const g = v.selCloud.geometry;
  g.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  g.setAttribute('color', new THREE.BufferAttribute(sc, 3));
  v.selCloud.visible = nSel > 0;
  return {ramp, nSel};
}
function paint(){
  const t = paintSet(V.tru, S.T), h = paintSet(V.hit, S.H);
  drawLegend(t ? t.ramp : null, h ? h.ramp : null);
  return {t, h};
}
const recolour = () => { if(!S.T) return; applyFilter();
                         for(const P of [S.T, S.H]) if(P) P.ramp = null; paint(); };

function drawLegend(rt, rh){
  const el = document.getElementById('legend'), rows = [];
  const sw = (c, t) => `<div class="row"><span class="sw" style="background:${c}"></span><span>${t}</span></div>`;
  if(S.mode === 'energy'){
    for(const [what, r] of [['truth: dE [MeV]', rt], ['hits: charge [ADC]', rh]]){
      if(!r) continue;
      const bar = (r.diverging ? DIV_RGB.map(rgb2css) : SEQ).map(c =>
        `<span style="background:${c};width:10px;height:10px;display:inline-block"></span>`).join('');
      const f = v => (r.lg ? unsymlog(v, r.lin) : v).toPrecision(3);
      rows.push(`<div class="row"><span>${what}</span></div><div class="row">${bar}</div>` +
                `<div class="row"><span class="k">${f(r.lo)} &rarr; ${f(r.hi)}${r.diverging ? ' · grey is zero' : ''}</span></div>`);
    }
    rows.push(`<div class="row"><span class="k">2nd&ndash;98th pct${document.getElementById('logE').checked ? ', symlog' : ''}</span></div>`);
  } else if(S.mode === 'sem'){
    for(const v of SEM_ORDER) if(S.semShow.has(v)) rows.push(sw(SEM_COLOR[v], SEM[v]));
  } else if(S.mode === 'pdg'){
    for(const [p, nm] of PDG_ORDER.slice(0, 6)) rows.push(sw(PDG_COLOR.get(p), nm));
    rows.push(sw(CAT_OTHER, 'other'));
  } else {
    rows.push(`<div class="row"><span>colour = ${S.mode === 'frag' ? 'fragment' : S.mode === 'inter' ? 'interaction' : 'instance'} id</span></div>`,
              `<div class="row"><span class="k">same id, same colour, both panes</span></div>`);
  }
  el.innerHTML = rows.join('');
}

// ------------------------------------------------------------ 3D panes --
function hostSize(host){
  const r = host.getBoundingClientRect();
  return {w: Math.max(1, Math.round(r.width) || innerWidth*0.5), h: Math.max(1, Math.round(r.height) || innerHeight - 90)};
}
function makeView(hostId, set){
  const host = document.getElementById(hostId);
  const {w, h} = hostSize(host);
  const v = {host, set, cloud:null, selCloud:null};
  v.scene = new THREE.Scene(); v.scene.background = new THREE.Color(0x0e1116);
  v.camera = new THREE.PerspectiveCamera(55, w/h, 0.1, 1e6); v.camera.position.set(600,600,600);
  v.renderer = new THREE.WebGLRenderer({antialias:true});
  v.renderer.setPixelRatio(devicePixelRatio); v.renderer.setSize(w, h, false);
  host.appendChild(v.renderer.domElement);
  v.controls = new OrbitControls(v.camera, v.renderer.domElement);
  v.controls.screenSpacePanning = true;
  host.addEventListener('pointerenter', () => { ACTIVE = v; });
  v.raycaster = new THREE.Raycaster(); v.pointer = new THREE.Vector2();
  v.renderer.domElement.addEventListener('mousemove', e => onMove(v, e));
  v.controls.addEventListener('change', () => syncFrom(v));
  const resize = () => { const s = hostSize(host); v.camera.aspect = s.w/s.h;
                         v.camera.updateProjectionMatrix(); v.renderer.setSize(s.w, s.h, false); };
  new ResizeObserver(resize).observe(host);
  (function tick(){ requestAnimationFrame(tick); v.controls.update(); v.renderer.render(v.scene, v.camera); })();
  return v;
}

// Camera sync keeps the two panes comparable: same viewpoint either side, so
// the drift-time displacement reads as a displacement.
let syncing = false;
function syncFrom(src){
  if(syncing || !document.getElementById('sync').checked) return;
  syncing = true;
  for(const dst of Object.values(V)){
    if(!dst || dst === src) continue;
    dst.camera.position.copy(src.camera.position); dst.camera.up.copy(src.camera.up);
    dst.controls.target.copy(src.controls.target); dst.camera.updateProjectionMatrix(); dst.controls.update();
  }
  syncing = false;
}
let ACTIVE = null;
function panView(v, dxPix, dyPix){
  if(!v) return;
  const el = v.renderer.domElement;
  const dist = new THREE.Vector3().subVectors(v.camera.position, v.controls.target).length();
  const half = dist * Math.tan((v.camera.fov / 2) * Math.PI / 180);
  const sx = 2 * dxPix * half / Math.max(1, el.clientHeight), sy = 2 * dyPix * half / Math.max(1, el.clientHeight);
  const m = v.camera.matrix.elements;
  const d = new THREE.Vector3(m[0], m[1], m[2]).multiplyScalar(-sx).add(new THREE.Vector3(m[4], m[5], m[6]).multiplyScalar(sy));
  v.camera.position.add(d); v.controls.target.add(d); v.controls.update(); syncFrom(v);
}
const PAN_KEYS = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,1], ArrowDown:[0,-1]};
addEventListener('keydown', e => {
  const k = PAN_KEYS[e.key]; if(!k) return;
  const v = ACTIVE || V.tru; if(!v) return;
  e.preventDefault(); const step = e.shiftKey ? 160 : 40; panView(v, k[0]*step, k[1]*step);
});

function buildCloud(v, P){
  for(const k of ['cloud', 'selCloud']) if(v[k]){ v.scene.remove(v[k]); v[k].geometry.dispose(); v[k].material.dispose(); v[k] = null; }
  if(!P.n) return;
  const size = +document.getElementById('psize').value;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(P.pts, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(P.n*4), 4));
  // alphaTest discards the fully transparent (filtered) points, so they write
  // no depth and punch no holes
  v.cloud = new THREE.Points(geo, new THREE.PointsMaterial({size, vertexColors:true, sizeAttenuation:false,
                                                            transparent:true, depthWrite:true, alphaTest:0.01}));
  v.scene.add(v.cloud);
  // The selection gets its own pass drawn over the top, so the dimmed bulk can
  // keep writing depth without hiding it.
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(0), 3));
  sg.setAttribute('color', new THREE.BufferAttribute(new Float32Array(0), 3));
  v.selCloud = new THREE.Points(sg, new THREE.PointsMaterial({size, vertexColors:true, sizeAttenuation:false,
                                                              depthTest:false, depthWrite:false}));
  v.selCloud.renderOrder = 2; v.scene.add(v.selCloud);
}

function fitView(){
  // Both panes framed on the union, so the displacement is not normalised away.
  const mn = [1e30,1e30,1e30], mx = [-1e30,-1e30,-1e30];
  for(const P of [S.T, S.H]) if(P) for(let i = 0; i < P.n; i++) for(let d = 0; d < 3; d++){
    const q = P.pts[i*3+d]; if(q < mn[d]) mn[d] = q; if(q > mx[d]) mx[d] = q; }
  if(mn[0] > mx[0]) return;
  const c = mn.map((q, i) => (q + mx[i])/2), span = Math.max(...mx.map((q, i) => q - mn[i]), 1);
  for(const v of Object.values(V)){
    if(!v) continue;
    v.controls.target.set(c[0], c[1], c[2]);
    v.camera.position.set(c[0]+span, c[1]+span*0.7, c[2]+span);
    v.camera.near = span/1000; v.camera.far = span*20; v.camera.updateProjectionMatrix();
    v.raycaster.params.Points.threshold = Math.max(span/300, 1e-6);
    v.controls.update();
  }
}

// Raycasting a few million points is not free, so pick at most every 50 ms.
let lastPick = 0;
function onMove(v, e){
  const P = v.set();
  if(!v.cloud || !P || !P.n) return;
  const now = performance.now(); if(now - lastPick < 50) return; lastPick = now;
  const r = v.renderer.domElement.getBoundingClientRect();
  v.pointer.x = ((e.clientX - r.left)/r.width)*2 - 1; v.pointer.y = -((e.clientY - r.top)/r.height)*2 + 1;
  v.raycaster.setFromCamera(v.pointer, v.camera);
  for(const h of v.raycaster.intersectObject(v.cloud, false)){
    if(!P.visible[h.index]) continue;
    infoPoint(P, h.index); select(P.key[h.index]); return;
  }
}

const fmt = (x, d=3) => (x === undefined || x === null || Number.isNaN(x)) ? '—'
  : (Math.abs(x) >= 1e5 || (x !== 0 && Math.abs(x) < 1e-3) ? Number(x).toExponential(2) : Number(x).toFixed(d));
const pdgName = p => PDG_NAME.has(p) ? `${p} (${PDG_NAME.get(p)})` : (p === -1 ? '—' : String(p));
function infoPoint(P, i){
  const rows = [];
  if(P === S.T){
    const f = P.feat, C = P.C, o = i * C;
    rows.push(['truth voxel', i.toLocaleString()],
              ['x y z [mm] (true)', `${fmt(f[o],1)}  ${fmt(f[o+1],1)}  ${fmt(f[o+2],1)}`],
              ['t [µs]', fmt(f[o+3], 2)], ['dE [MeV]', fmt(f[o+4], 4)], ['dX [cm]', fmt(f[o+5], 4)]);
    if(C >= 9) rows.push(['θ φ [rad]', `${fmt(f[o+6],3)}  ${fmt(f[o+7],3)}`], ['|p| [MeV/c]', fmt(f[o+8], 2)]);
  }else{
    rows.push(['hit', `volume ${P.vol[i]} · #${P.src[i].toLocaleString()}`],
              ['py pz tick', `${P.py[i]}  ${P.pz[i]}  ${P.tick[i]}`],
              ['x y z [mm] (inferred)', `${fmt(P.pts[i*3],1)}  ${fmt(P.pts[i*3+1],1)}  ${fmt(P.pts[i*3+2],1)}`],
              ['charge [ADC]', fmt(P.e[i], 2)], ['on sensor', P.on[i] ? 'yes' : 'no']);
  }
  const sem = semOf(P, i);
  rows.push(['fragment', P.frag[i] < 0 ? '—' : String(P.frag[i])],
            ['instance', P.inst[i] < 0 ? '—' : String(P.inst[i])],
            ['interaction', interOf(P, i) < 0 ? '—' : String(interOf(P, i))],
            ['semantic type', SEM[sem] ? `${SEM[sem]} <span class="k">(${sem})</span>` : '—'],
            ['instance pdg', pdgName(pdgOf(P, i))]);
  const el = document.getElementById('pinfo');
  el.innerHTML = '<table>' + rows.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('') + '</table>';
  el.style.display = 'block';
}

// One key drives both panes; that is the link being shown.
function select(key){
  key = Number(key);
  if(key === S.sel) return;
  S.sel = key;
  const {t, h} = paint();
  const lvl = S.hl === 'frag' ? 'fragment' : S.hl === 'inter' ? 'interaction' : 'instance';
  statusEl.innerHTML = key < 0 ? `<span class="k">not traced to a particle</span>`
    : `<b>${lvl} ${key}</b>   <span class="k">truth voxels</span> <span class="v">${(t ? t.nSel : 0).toLocaleString()}</span>` +
      `   <span class="k">hits</span> <span class="v">${(h ? h.nSel : 0).toLocaleString()}</span>`;
}

// ----------------------------------------------------------------- rebuild --
function rebuild(){
  if(!S.out) return;
  if(!V.tru) V.tru = makeView('pane-true', () => S.T);
  if(!V.hit) V.hit = makeView('pane-hit', () => S.H);
  S.sel = -1;
  try{
    buildParticles(); buildTruth(); buildHits();
    buildKeys(); buildFilters(); applyFilter();
    buildCloud(V.tru, S.T); buildCloud(V.hit, S.H);
    paint(); fitView();
    const off = document.getElementById('offsensor').checked;
    document.getElementById('hit-ttl').innerHTML =
      `<b>hits</b>   the JAXTPC hits · inferred x (t0 = tick 0)` + (off ? '' : ' · on-sensor only');
    statusEl.innerHTML = `<b>event ${S.ev}</b>   <span class="k">truth voxels</span> <span class="v">${S.T.n.toLocaleString()}</span>` +
      `   <span class="k">hits</span> <span class="v">${S.H.n.toLocaleString()}</span>` +
      (S.hit ? '' : '\n<span class="k">load the hits subset to see the hits</span>');
    log(`event ${S.ev}: ${S.T.n.toLocaleString()} truth voxels, ${S.H.n.toLocaleString()} hits`);
  }catch(err){ log('ERROR: ' + err.message); statusEl.textContent = 'error: ' + err.message; console.error(err); }
}
</script>
