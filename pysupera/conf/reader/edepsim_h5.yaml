# Reader configuration for plain EDepSim HDF5 input.
#
# This is the base every reader config in this group builds on.  Selected
# with:
#
#   defaults:
#     - reader: edepsim_h5
#
# or on the command line:
#
#   run_pysupera reader=edepsim_h5 reader.particle_key=particle/geant4_custom
#
# On its own it reads EDepSim directly: each particle's point cloud is every
# Geant4 energy-deposit step in the file, with no detector simulation in
# between.  For JAXTPC input pick one of the siblings instead:
#
#   reader=jaxtpc_wire    wire readout   (U/V/Y planes, three 2-D projections)
#   reader=jaxtpc_pixel   pixel readout  (one Pixel plane, natively 3-D)

# Identifies which reader class build_reader() should instantiate.
# Do not change unless you are adding a new reader format.
format: edepsim_h5

# ---------------------------------------------------------------------------
# HDF5 dataset keys
# Each of these corresponds to a top-level dataset path inside the HDF5 file.
# ---------------------------------------------------------------------------

# Per-event structured array of Geant4 particles.
# Expected fields: track_id, parent_track_id, root_track_id, pdg,
#                  proc_start, subproc_start, ke, x, y, z
particle_key: particle/geant4

# Per-event structured array of Geant4 vertices.
# Expected fields: x, y, z, t, interaction_id
vertex_key: vertex/geant4

# Flat per-event energy-deposit step array (the point cloud).
# Columns 0-2 must be x, y, z.  Not used in JAXTPC mode.
step_key: pstep/lar_vol

# Association table mapping particle index to slice in step_key.
# Expected fields: start, end  (integer arrays of length N_particles).
# Not used in JAXTPC mode.
ass_key: ass/particle_pstep_lar_vol

# ---------------------------------------------------------------------------
# Physics / classification parameters
# ---------------------------------------------------------------------------

# Kinetic-energy threshold (MeV) used by the interaction-type classifier to
# distinguish low-energy electrons (→ kCompton) from higher-energy ones
# (→ kOtherShower) when no cleaner G4 process tag is available.
electron_energy_threshold: 0.05
