# @package _global_
#
# Kept so existing command lines work: reader=jaxtpc_pixel now reads the
# detected hits by default and brings its own settings (readout/jaxtpc_pixel),
# so this preset only selects that reader.
#
#   run_pysupera preset=cubic_pixel_hits ...   ==   run_pysupera reader=jaxtpc_pixel ...

defaults:
  - override /reader: jaxtpc_pixel
