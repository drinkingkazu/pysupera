defaults:
  - io: default
  # Reader config group.  Currently only "edepsim_h5" is available.
  # JAXTPC visibility filtering is not a separate reader — it is activated
  # by setting two optional flags on the same edepsim_h5 config:
  #
  #   reader.jaxtpc_seg_path=sim_seg_0000.h5
  #   reader.jaxtpc_inst_path=sim_inst_0000.h5
  #
  # When both are non-null, only segments visible in the JAXTPC readout are
  # included in each particle's point cloud.  Particle metadata (PDG, track
  # IDs, interaction type) always comes from the EDepSim file (io.input_path).
  - reader: edepsim_h5
  - checker: cpu_single
  - conditions: default
  - _self_

# ---------------------------------------------------------------------------
# Top-level workflow parameters
# ---------------------------------------------------------------------------

# Proximity distance threshold (same spatial units as point cloud coords).
distance_threshold: 5.2

# Maximum number of events to process.  -1 (default) means all events.
max_events: -1

# Show a tqdm progress bar during the event loop.
# Set false to suppress all dynamic output (useful when stdout is redirected).
progress: true

# Print per-event timing and merge counts (condition passes, per-event elapsed).
# Set false to suppress all per-event chatter — ideal for production.
verbose: false

# Print an end-of-run summary report: time profile and particle/partition
# statistics aggregated over all events.  Set false for completely silent runs.
report: true

# Record every merge decision for post-hoc inspection.
enable_diagnostics: false

# Verify that every particle carries an interaction ID before partitioning.
#
# Interaction IDs are seeded from particles whose start point coincides with a
# vertex and then propagated down the genealogy, so one broken ancestor link
# strands a particle and all of its descendants at -1.  That loss is silent,
# which is why it is checked rather than assumed.
#
# true (default) — raise ValueError listing the offenders and their parent
#                  chains, so the assignment can be traced.
# false          — warn once per event and continue.
check_interaction_id: true

# Verify that every particle's root_id is the primary its parent chain leads
# to.  Guards the same class of upstream defect as check_interaction_id: an
# EDepSim ancestor field that disagrees with parent_track_id puts whole
# subtrees on a false root.
#
# true (default) — raise ValueError listing the inconsistent particles.
# false          — warn once per event and continue.
check_root_id: true

# ---------------------------------------------------------------------------
# Post-run repack (opt-in)
# ---------------------------------------------------------------------------
# Rewrite the output file once the event loop has finished, sizing every chunk
# from the dataset's final length.
#
# Why this is a separate pass: the writer creates each dataset empty and grows
# it with resize() as events arrive, so when a chunk shape must be chosen the
# final length is not yet known.  Chunk shapes come from a byte budget (see
# _CHUNK_TARGET_BYTES in io.py), which bounds the waste to at most one chunk per
# dataset -- but a dataset that ends up shorter than a single chunk still stores
# the remainder as padding.  Repacking clamps every chunk to the real length.
#
# The gain is therefore largest for SHORT runs, where several datasets are
# shorter than one chunk, and small for long production runs.  It costs one full
# read+write of the output file.
repack:
  enabled: false
  # Filter for the repacked file.  null keeps whatever each dataset already
  # uses; set to gzip to produce a browser/h5wasm-readable file in one step.
  compression: ~
  # Compression level for the above (gzip: 1-9).
  compression_opts: ~

# Tolerate "empty images" — events in which every particle ends up with an
# empty point cloud, so the event carries no reconstructable charge at all.
#
# false (default) — raise RuntimeError and halt on the first empty image.
#                   An all-empty event almost always signals a configuration
#                   mistake (e.g. the wrong reader.jaxtpc_seg_path / step_key)
#                   rather than real physics, and silently writing thousands of
#                   empty events is far worse than stopping early.
# true            — allow empty images through, emitting a single warning the
#                   first time one is encountered (not once per event).  Use
#                   when empty events are genuinely expected, e.g. very low
#                   readout thresholds or heavily masked detector volumes.
allow_empty_image: false

# Verify that the particle list is self-consistent before partitioning:
# every parent_id referenced by a particle must correspond to a particle
# in the list.  Raises ValueError listing all missing parent IDs when
# the check fails.  Disable (false) for performance or when incomplete
# particle lists are expected.
check_particle_tree: false

# ---------------------------------------------------------------------------
# Output filtering options
# ---------------------------------------------------------------------------

# Compact output: skip writing raw input-level (Level 0) particles.
# Only fragment representatives (Level 1) and instance representatives
# (Level 2) are stored, which is sufficient for most downstream analyses.
# Reduces output file size significantly when input particles are numerous.
output_compact: true

# Drop kLEScatter particles from all output levels.
# When true, particles with sem_type == kLEScatter are excluded from
# fragments, instances, and (when output_compact is false) raw particles.
# Useful when low-energy scatter products are not needed downstream.
drop_le_scatter: false

# Which particle instances to write.
#
# all       — every instance the step-2 merger produced, including the many
#             that deposited nothing (63% of them in a typical event).
# traceable — instances with a non-empty point cloud, plus the zero-point
#             ancestors needed to complete their genealogy (a pi0 linking two
#             visible photons, say), plus the primaries of every interaction
#             that has at least one visible instance.  An interaction with no
#             visible instance is dropped entirely: it left no trace, so
#             nothing in the detector represents it.
#
# 'traceable' keeps every row reachable from a visible one, so walking
# parent_inst_id still terminates at a primary.  On a sample event it retains
# 207 of 535 instances.
instance_output: traceable

# Write the step-1 fragment level (particle_fragments, its point clouds and
# member lists).
#
# Fragments are an intermediate product: step-2 merging groups them into
# instances, and most analyses work at the instance level.  Their point payload
# is a second copy of the same points the instance level already stores, so
# skipping them is the single largest space saving available -- roughly 20% of
# a typical output file.
#
# false (default) — particle_fragments and friends are created but left empty,
#                   exactly as particles/ behaves under output_compact.  The
#                   fragment stage still runs; only the output is skipped.
# true            — write the fragment level too.
#
# When false, instance parent_frag_id is set to -1 rather than pointing into a
# table that was not written.
write_fragments: false

# Write event-level union point clouds (event_cloud and le_scatter_cloud).
# event_cloud     : union of all particles' point clouds for each event,
#                   voxelized with the same voxel_size/origin as particle
#                   pre-processing when voxelization is enabled.
# le_scatter_cloud: same but restricted to kLEScatter particles only.
# Set false to omit these datasets and reduce output file size.
write_event_clouds: true

# ---------------------------------------------------------------------------
# Particle construction parameters
# ---------------------------------------------------------------------------
particle:
  # Minimum point-cloud size for SetSemanticType classification.
  # Particles with fewer points than this are treated as having an
  # unknown semantic type.  -1 disables the check (all sizes accepted).
  min_pc_size: 5

  # Pre-processing: voxelize point clouds onto a regular 3-D grid.
  # Bins each point into a voxel cell, snaps its position to the voxel
  # centre, and merges all points in the same voxel (time=min, energy=sum,
  # dedx=max).  This is a strict generalisation of merge_duplicates; when
  # voxelize.enabled is true, merge_duplicates is redundant.
  voxelize:
    enabled: true
    # Voxel side length in the same units as the point-cloud coordinates.
    # A single float produces an isotropic grid; set to [dx, dy, dz] for
    # an anisotropic grid.
    voxel_size: 3
    # Lower corner of the grid.  null = use each cloud's own coordinate
    # minimum (per-particle alignment, default).  Set to [x0, y0, z0] for
    # a globally fixed grid anchored at a known detector boundary.
    origin: [-2160.,-2160.,-2160.]
    # When true, skips the separate merge_duplicates preprocessing step.
    # Safe because exact-coordinate duplicates always fall in the same voxel.
    merge_duplicates: true
    # When true, VoxelizeProcessor stores a CSR mapping (input_ids,
    # input_energies, voxel_offsets) for every particle in last_diagnostics,
    # enabling traces from output voxels back to input points.
    store_mapping: true

  # Pre-processing: collapse points sharing identical 3-D coordinates.
  # Aggregation rules: time=min, energy=sum, dedx=max.
  # Runs before defragmentation so min_pc_size counts unique voxels.
  # Redundant when voxelize.enabled is true.
  merge_duplicates: true

  # Pre-processing: defragment point clouds before partitioning.
  # When true, each particle's point cloud is clustered with an eps-ball
  # connected-components algorithm (eps = distance_threshold).  If more
  # than one cluster is found, fragments with size <= min_pc_size are split
  # off into separate kLEScatter particles.
  defragment: true

  # Defragmentation backend.  Only used when defragment: true.
  #
  # scipy  (default) — CPU, scipy cKDTree + sparse connected_components.
  # gpu             — CuPy pairwise distance matrix + CPU connected_components.
  #                   Falls back to scipy for clouds with < min_pts_for_gpu pts.
  # rapids          — Fully GPU: CuPy edges + cuGraph connected_components.
  #                   Requires cuDF + cuGraph (RAPIDS).
  preprocessor:
    name: scipy
    # Minimum cloud size to route to GPU (gpu / rapids backends only).
    min_pts_for_gpu: 64
    # Restrict defragmentation to these semantic types.
    # Empty list (default) means all semantic types are processed.
    # Valid values: kShower, kTrack, kDelta, kMichel, kLEScatter, kUnknown
    # Example: [kShower, kTrack]
    sem_types: [kShower,kDelta,kMichel,kLEScatter]
    