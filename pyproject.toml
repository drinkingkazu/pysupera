[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysupera"
version = "0.0.1"
description = "Particle partitioning library for LArTPC simulation reconstruction"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    # Registers the Blosc/LZ4 HDF5 filters.  Required to read JAXTPC seg/inst
    # files (written with Blosc, filter 32001) and to write io.compression=lz4.
    "hdf5plugin",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
gpu = [
    "cupy",
]
rapids = [
    "cupy",
    # cudf and cugraph must be installed via RAPIDS conda channel
]
numba = [
    "numba",
]
# Required by pysupera.torchdata (training-data pipeline) only.
torch = [
    "torch",
    # Per-process RSS, including DataLoader workers.  pysupera.profiling
    # falls back to /proc without it, losing the worker figures.
    "psutil",
]
# Weights & Biases logging of the training-data pipeline.  Optional:
# pysupera.profiling.WandbLogger is a silent no-op when it is absent.
wandb = [
    "wandb",
]
dev = [
    "pytest",
    "jupyter",
    "plotly",
]
app = [
    "dash>=2.14",
    "plotly>=5.18",
]

[project.scripts]
run_pysupera        = "pysupera._run:main"
pysupera-app        = "pysupera.app:main"
pysupera-repack     = "pysupera.io:repack_cli"
pysupera-hits-subset = "pysupera.hits_subset:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pysupera*"]

[tool.setuptools.package-data]
pysupera = [
    "conf/*.yaml",
    "conf/**/*.yaml",
]
